mech-armor-mk3-base=Super-heavy armor class. Dual portable fission reactors and advanced electronics provide massive capacity and an extensive equipment grid. A walking fortress.
mech-armor-mk4-base=A marvel of engineering. A multi-core reactor system and integrated force-field emitters grant near-total invulnerability and incredible power.

