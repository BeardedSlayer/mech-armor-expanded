[item-description]
mech-armor-mk2=Улучшенная версия шагающего костюма. Вольфрамовая броня и расширенная сетка модулей. Игнорирует движение конвейеров и позволяет безопасно перемещаться по лаве и агрессивным жидкостям.
mech-armor-mk3=Сверхтяжёлый класс брони. Квантовые процессоры и углеволокно обеспечивают колоссальную вместимость и огромную сетку под оборудование. Ходячая крепость.
mech-armor-mk4=Вершина инженерной мысли. Нейросеть костюма питается энергией прометия из глубокого космоса. Даёт абсолютный иммунитет к огню и невероятную мощность.

