[technology-description]
mech-armor-mk2=Открывает доступ к улучшенному меха-костюму с увеличенным инвентарём и сеткой модулей размером 16х16.
mech-armor-mk3=Сверхпрочный шагающий танк с сеткой 20х20, усиленный углеволокном и карбидом вольфрама.
mech-armor-mk4=Ультимативная машина с сеткой 24х24. Мощь глубокого космоса и абсолютное превосходство над любой фауной.